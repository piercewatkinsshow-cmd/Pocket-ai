name: Build Pocket AI v1.6

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.6 integration fixes
        run: git apply --check ci/v1.6.patch && git apply ci/v1.6.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Align APK
        run: "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk PocketAI-v1.6-aligned-unsigned.apk

      - name: Upload aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-v1.6-aligned
          path: PocketAI-v1.6-aligned-unsigned.apk
          if-no-files-found: error
