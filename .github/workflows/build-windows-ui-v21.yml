name: Build AI Fantasy Football UI V2.1

on:
  push:
    branches: [windows-ui-v2.1]
    paths:
      - 'windows-ui-v21/**'
      - '.github/workflows/build-windows-ui-v21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct V2 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem windows-ui-v2/chunk*.txt | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 V2 source chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('windows-ui-v2-src.zip', [Convert]::FromBase64String($b64))
          Expand-Archive windows-ui-v2-src.zip -DestinationPath src-v2 -Force
          if (!(Test-Path 'src-v2/AIFantasyFootballV2.csproj')) { throw 'V2 source project was not reconstructed.' }

      - name: Apply V2.1 patch
        shell: pwsh
        run: |
          $b64 = (Get-Content 'windows-ui-v21/v21rel.patch.gz.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('v21rel.patch.gz', [Convert]::FromBase64String($b64))
          $input = [IO.File]::OpenRead('v21rel.patch.gz')
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create('v21rel.patch')
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()
          git apply --directory=src-v2 --verbose v21rel.patch
          if ($LASTEXITCODE -ne 0) { throw 'V2.1 source patch failed.' }
          Select-String -Path 'src-v2/README.md' -Pattern 'V2.1' | Out-Null
          Select-String -Path 'src-v2/MainForm.cs' -Pattern 'ExportLeague' | Out-Null
          Select-String -Path 'src-v2/Services.cs' -Pattern 'db_fpecr_latest.csv' | Out-Null

      - name: Restore
        shell: pwsh
        run: dotnet restore src-v2/AIFantasyFootballV2.csproj

      - name: Publish self-contained Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish src-v2/AIFantasyFootballV2.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish-v21

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'publish-v21/AI-Fantasy-Football.exe')) { throw 'V2.1 EXE was not produced.' }
          Get-Item 'publish-v21/AI-Fantasy-Football.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'publish-v21/AI-Fantasy-Football.exe' -Algorithm SHA256 | Format-List

      - name: Package documentation
        shell: pwsh
        run: Copy-Item 'src-v2/README.md' 'publish-v21/README.txt'

      - name: Upload Windows V2.1 build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fantasy-Football-Windows-UI-V2.1
          path: publish-v21/**
          if-no-files-found: error
          retention-days: 30
